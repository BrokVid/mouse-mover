[package]
name = "mouse-mover"
version = "0.1.0"
edition = "2024"
description = "Lightweight tray utility that prevents idle lock via documented Win32 input"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/BrokVid/mouse-mover"
homepage = "https://github.com/BrokVid/mouse-mover"
authors = ["BrokVid"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "z"
